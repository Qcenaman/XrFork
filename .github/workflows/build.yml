name: Build and test

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests "*TagalogLanguageTest*"
      - name: Build APK
        env:
          XRFORK_KEYSTORE_PATH: ${{ github.workspace }}/Android/src/app/xrfork.jks
          XRFORK_KEYSTORE_PASSWORD: xrforksign
          XRFORK_KEY_ALIAS: xrfork
          XRFORK_KEY_PASSWORD: xrforksign
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/XrFork-Tagalog.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: XrFork-Tagalog-apk
          path: XrFork-Tagalog.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG="$(git log -1 --format=%B)"
          TAG="$(printf '%s\n' "$MSG" | sed -n 's/^Release: *//p' | head -1)"
          if [ -z "$TAG" ]; then echo "No Release: line, skipping"; exit 0; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG exists"; exit 0; fi
          printf '%s\n' "$MSG" | sed '1d' | sed '/^Release:/d;/^Co-Authored-By:/d;/^Claude-Session:/d' > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$GITHUB_WORKSPACE/XrFork-Tagalog.apk" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
