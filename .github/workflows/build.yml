name: Build and test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests "*TagalogLanguageTest*"
      - name: Build APK
        env:
          XRFORK_KEYSTORE_PATH: ${{ github.workspace }}/Android/src/app/xrfork.jks
          XRFORK_KEYSTORE_PASSWORD: xrforksign
          XRFORK_KEY_ALIAS: xrfork
          XRFORK_KEY_PASSWORD: xrforksign
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/XrFork-Tagalog.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: XrFork-Tagalog-apk
          path: XrFork-Tagalog.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$GITHUB_WORKSPACE/XrFork-Tagalog.apk" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
